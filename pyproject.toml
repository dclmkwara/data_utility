[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dclm-field-utility"
version = "1.1.0"
description = "Offline-first field data capture for authorized DCLM church workers"
requires-python = ">=3.11"
dependencies = [
    "python-fasthtml==0.14.13",
    "faststrap==0.10.1",
    "fastapi[standard]>=0.115,<1.0",
    "cryptography==50.0.2",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.fastapi]
entrypoint = "app.main:app"
